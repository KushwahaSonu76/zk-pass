name: ZkPass Core CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test Compact Circuits
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Verify TypeScript Typechecking
        run: npx tsc --noEmit

      - name: Execute Vitest Unit & Privacy Tests
        run: npm test

      - name: Build Frontend Application
        run: npm run build:frontend

      - name: CI Pipeline Success Badge Check
        run: echo "ZkPass Core CI pipeline executed successfully with zero failures."
